version: '3.8'

services:
  savepr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savepr-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./downloads:/app/downloads
